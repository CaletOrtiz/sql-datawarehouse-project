name: Build data warehouse

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull --tag sql-datawarehouse:ci .

      - name: Generate and validate warehouse
        env:
          TPCH_SCALE_FACTOR: "0.01"
        run: |
          mkdir -p data sources/tbl
          docker run --rm \
            --env TPCH_SCALE_FACTOR \
            --volume "$GITHUB_WORKSPACE/data:/app/data" \
            --volume "$GITHUB_WORKSPACE/sources/tbl:/app/sources/tbl" \
            sql-datawarehouse:ci

      - name: Upload DuckDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-warehouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/dwh.duckdb
          if-no-files-found: error
          retention-days: 14
