name: Build data warehouse

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # Cambiado de 'read' a 'write' para permitir crear Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull --tag sql-datawarehouse:ci .

      - name: Generate and validate warehouse
        env:
          TPCH_SCALE_FACTOR: "0.01"
        run: |
          mkdir -p data sources/tbl
          docker run --rm \
            --env TPCH_SCALE_FACTOR \
            --volume "$GITHUB_WORKSPACE/data:/app/data" \
            --volume "$GITHUB_WORKSPACE/sources/tbl:/app/sources/tbl" \
            sql-datawarehouse:ci

      # 1. Conservas el paso de Artefactos existente
      - name: Upload Power BI Parquet files
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-parquet-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/parquet/*.parquet
          if-no-files-found: error
          retention-days: 14

      # 2. Agregas este paso DEBAJO para publicar la URL fija
      - name: Publicar Parquet en GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: data/parquet/*.parquet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
